<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sathish S | Portfolio</title>
<meta name="description" content="Portfolio of Sathish S — Computer Science undergraduate, full-stack &amp; AI builder." />
<meta name="theme-color" content="#05070d" />
<link rel="icon" href="assets/images/logo.png" />
<link rel="manifest" href="assets/manifest.json" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #030409;
    overflow: hidden;
  }
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    mix-blend-mode: screen;
  }
  #bg-canvas canvas { width: 100%; height: 100%; display: block; }

  .welcome-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 4rem 3rem;
    border-radius: 32px;
    text-align: center;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
    max-width: 460px;
    width: 90%;
    animation: cardEntrance 1.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardEntrance {
    from { opacity: 0; transform: scale(0.92) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .logo-img {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    margin: 0 auto 22px;
    box-shadow: 0 12px 40px -8px rgba(124, 92, 255, 0.6);
    animation: floatLogo 4s ease-in-out infinite;
  }
  @keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .welcome-card h1 {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .welcome-card p {
    color: var(--text-1);
    font-size: 0.98rem;
    margin-bottom: 28px;
    min-height: 24px;
  }
  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.96rem;
    color: #08080f;
    background: var(--accent-gradient);
    box-shadow: 0 14px 34px -10px rgba(124, 92, 255, 0.6);
    transition: transform 220ms cubic-bezier(0.22,1,0.36,1), box-shadow 220ms;
  }
  .enter-btn:hover { transform: translateY(-3px); box-shadow: 0 20px 44px -10px rgba(124, 92, 255, 0.75); }
  .enter-btn svg { width: 16px; height: 16px; }

  .skip-note {
    position: fixed;
    bottom: 22px;
    left: 0; right: 0;
    text-align: center;
    z-index: 2;
    color: var(--text-2);
    font-size: 0.8rem;
  }
  .skip-note a { color: var(--text-1); text-decoration: underline; text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .welcome-card, .logo-img { animation: none; }
  }
</style>
</head>
<body>
  <div id="bg-canvas"></div>

  <main class="welcome-card">
    <img class="logo-img" src="assets/images/logo.png" alt="Sathish S logo" />
    <h1>Welcome — I'm Sathish S</h1>
    <p id="tagline">Computer Science undergraduate · Full-stack &amp; AI builder</p>
    <a class="enter-btn" href="home.html" id="enter-link">
      Enter Portfolio
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>
  </main>

  <p class="skip-note">Taking too long? <a href="home.html">Go straight to the portfolio</a></p>

  <script src="assets/js/wave-bg.js"></script>
  <script>
    // Multi-sentence tagline rotator, then auto-advance isn't forced —
    // the visitor stays in control and clicks Enter when ready.
    (function () {
      var el = document.getElementById("tagline");
      var lines = [
        "Computer Science undergraduate · Full-stack & AI builder",
        "Turning ideas into working, well-crafted software",
        "Full-stack development · AI tools · Clean interfaces"
      ];
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var i = 0;
      setInterval(function () {
        i = (i + 1) % lines.length;
        el.style.opacity = 0;
        setTimeout(function () {
          el.textContent = lines[i];
          el.style.transition = "opacity 400ms ease";
          el.style.opacity = 1;
        }, 260);
      }, 3200);
    })();
  </script>
</body>
</html>
